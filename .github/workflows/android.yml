# Android-Bau auf dem eigenen Runner (CT 140 auf pve2, Debian, Gruppe
# rosenweg-privat) nach dem Muster von rosenweg-vm (.github/workflows/linux.yml).
#
# Der Runner hat kein allgemeines sudo, nur ein eingeschraenktes apt-get.
# Darum: Flutter, JDK und Android-Kommandozeilenwerkzeuge als feste Versionen
# mit Pruefsumme in einen Cache im Benutzerverzeichnis — nichts systemweit.
# Plattform, Build-Tools und NDK laedt das Android-Gradle-Plugin beim ersten
# Bau selbst in dasselbe SDK (Lizenzen sind akzeptiert, sdkmanager prueft die
# Pakete). Der Cache bleibt zwischen Laeufen liegen.
#
# Die Basis (Rosenweg/rosenweg-basis) ist privat: pub holt sie mit dem Secret
# BASIS_TOKEN (fein granulierter Token, nur dieses Repo, Contents read-only)
# oder BASIS_DEPLOY_KEY (Deploy-Key, lesen). Signiert wird mit dem
# Rosenweg-Schluessel, wenn ANDROID_KEYSTORE_BASE64 & Co. gesetzt sind, sonst
# mit dem Debug-Schluessel (Datei heisst dann ...-debug-signiert.apk).
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
  JDK_VERSION: "21.0.13.1+2"
  JDK_SHA256: bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e
  # cmdline-tools 19.0: ab 23.0 ist sdkmanager nur noch ein Verweis auf die
  # neue "android"-CLI, --licenses tut dort nichts (keine Lizenzen, kein SDK).
  ANDROID_CMDLINE_TOOLS: "13114758"
  ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee

jobs:
  bauen:
    runs-on:
      group: rosenweg-privat
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete
        run: |
          noetig="curl unzip xz-utils git openssh-client"
          fehlt=""
          for p in $noetig; do dpkg -s "$p" >/dev/null 2>&1 || fehlt="$fehlt $p"; done
          if [ -n "$fehlt" ]; then
            echo "Fehlende Pakete:$fehlt"
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq --no-install-recommends $fehlt
          fi

      - name: Flutter, JDK, Android-SDK (Cache im Benutzerverzeichnis)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          J="$C/jdk-${JDK_VERSION//+/_}"
          if [ ! -x "$J/bin/java" ]; then
            curl -fsSL -o "$C/jdk.tgz" "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION//+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"
            echo "$JDK_SHA256  $C/jdk.tgz" | sha256sum -c -
            mkdir -p "$J" && tar -xzf "$C/jdk.tgz" -C "$J" --strip-components=1 && rm "$C/jdk.tgz"
          fi
          A="$C/android-sdk"
          if [ ! -x "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" ]; then
            curl -fsSL -o "$C/ct.zip" "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
            echo "$ANDROID_CMDLINE_TOOLS_SHA256  $C/ct.zip" | sha256sum -c -
            rm -rf "$C/ct" && unzip -q "$C/ct.zip" -d "$C/ct" && rm "$C/ct.zip"
            mkdir -p "$A/cmdline-tools"
            rm -rf "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && mv "$C/ct/cmdline-tools" "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && rm -rf "$C/ct"
          fi
          ln -sfn "$ANDROID_CMDLINE_TOOLS" "$A/cmdline-tools/latest"
          (yes || true) | JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" --licenses >/dev/null
          # Flutter erkennt das SDK erst an licenses/ oder platform-tools/.
          if [ ! -d "$A/platform-tools" ]; then
            JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" "platform-tools" >/dev/null
          fi
          for d in licenses platform-tools; do
            [ -d "$A/$d" ] || { echo "::error::Android-SDK unvollstaendig: $A/$d fehlt"; exit 1; }
          done
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "$J/bin" >> "$GITHUB_PATH"
          {
            echo "JAVA_HOME=$J"
            echo "ANDROID_HOME=$A"
            echo "ANDROID_SDK_ROOT=$A"
            echo "GRADLE_USER_HOME=$C/gradle"
            echo "GRADLE_OPTS=-Dorg.gradle.daemon=false"
            echo "PUB_CACHE=$C/pub-cache"
          } >> "$GITHUB_ENV"

      - name: Zugang zur Basis (privates Repo)
        uses: ./.github/actions/basis-zugang
        with:
          token: ${{ secrets.BASIS_TOKEN }}
          deploy-key: ${{ secrets.BASIS_DEPLOY_KEY }}

      - name: pubspec.lock ohne lokale Basis
        run: |
          if grep -q 'source: path' pubspec.lock; then
            echo "::error file=pubspec.lock::pubspec.lock enthaelt einen path-Eintrag (pubspec_overrides.yaml war aktiv). Vor dem Commit 'git checkout pubspec.lock' bzw. ohne Overrides 'flutter pub get'."
            exit 1
          fi

      - name: Flutter pruefen
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Signierschluessel (falls als Secret hinterlegt)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rosenweg.jks")
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/rosenweg.jks" >> "$GITHUB_ENV"
            echo "Signatur: Rosenweg-Schluessel"
          else
            echo "::warning::Kein Rosenweg-Signierschluessel als Secret — APK ist mit dem Debug-Schluessel signiert."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version $version in pubspec.yaml"
            exit 1
          fi
          flutter build apk --release
          if [ -n "${SIGNING_STORE_FILE:-}" ]; then
            name="rosenweg-salz-$version.apk"
          else
            name="rosenweg-salz-$version-debug-signiert.apk"
          fi
          mkdir -p ausgabe
          cp build/app/outputs/flutter-apk/app-release.apk "ausgabe/$name"
          (cd ausgabe && sha256sum *.apk > SHA256SUMS)
          cat ausgabe/SHA256SUMS

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/rosenweg.jks" "$RUNNER_TEMP/basis_key" "$RUNNER_TEMP/known_hosts"

      - uses: actions/upload-artifact@v4
        with:
          name: rosenweg-salz-android
          path: ausgabe/
          retention-days: 14

  veroeffentlichen:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bauen
    runs-on:
      group: rosenweg-privat
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write    # OIDC-Token fuer /apps (kein Geheimnis)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rosenweg-salz-android
          path: ausgabe

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const dateien = fs.readdirSync('ausgabe');
            const debug = dateien.some((f) => f.endsWith('-debug-signiert.apk'));
            const text = debug
              ? 'Android-APK, **mit dem Debug-Schluessel signiert** (noch kein Rosenweg-Signierschluessel hinterlegt). Pruefsummen in SHA256SUMS.'
              : 'Android-APK, mit dem Rosenweg-Schluessel signiert. Pruefsummen in SHA256SUMS.';
            // Die Laeufe der anderen Plattformen (linux.yml, macos.yml,
            // windows.yml) legen dasselbe Release womoeglich zuerst an.
            const finden = () => github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag });
            let rel;
            try {
              rel = await finden();
            } catch (e) {
              try {
                rel = await github.rest.repos.createRelease({
                  owner: context.repo.owner, repo: context.repo.repo, tag_name: tag,
                  name: `Rosenweg Salz ${tag}`, body: text,
                });
              } catch (e2) {
                rel = await finden();
              }
            }
            for (const f of dateien) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.data.id,
                name: f,
                data: fs.readFileSync(path.join('ausgabe', f)),
              });
            }

      # Auf www.rosenweg4303.ch/apps (und in den Katalog der geteilten Telefone, falls die
      # Technik die App dort angelegt hat). Die Anlage nimmt nur mit dem Rosenweg-Schluessel
      # signierte APKs an; ein Debug-Bau bleibt nur im GitHub-Release.
      # Weg: Rosenweg/Website, pbx/README.md, "Seite /apps und App-Releases".
      - name: Debug-Bau?
        id: art
        run: |
          if ls ausgabe/*-debug-signiert.apk >/dev/null 2>&1; then
            echo "debug=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Debug-signierte APK – nicht an /apps (Rosenweg-Signierschluessel als Secret fehlt)."
          fi

      - uses: Rosenweg/Website/.github/actions/apps-release@main
        if: steps.art.outputs.debug != '1'
        with:
          dateien: ausgabe/*.apk
          paket: ch.rosenweg4303.salz
