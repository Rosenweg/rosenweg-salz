# Linux-Bau (Debian-Paket fuer die Stationen von Rosenweg OS) auf einem
# GitHub-Runner (ubuntu-latest) im Container debian:13, nie auf einem eigenen
# Runner (oeffentliches Repo). Muster: rosenweg-vm .github/workflows/linux.yml.
#
# Systempakete (GTK-Header, libsecret) ueber apt-get, Flutter als feste
# Version mit Pruefsumme (linux/paket/werkzeuge.env), zwischen Laeufen im
# actions/cache. Das .deb baut derselbe Weg wie im Bau-Container
# (linux/paket/bauen.sh --nur-paket aus dem Buendel dieses Laufs).
#
# Bei einem Tag v* (= version in pubspec.yaml): .deb ins GitHub-Release und
# auf www.rosenweg4303.ch/apps (linux-deb). Die Stationen holen das Paket
# weiterhin mit Pruefsumme vom PXE-Server (os-stationen, pakete/rosenweg-salz/).
name: Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    # Debian 13 wie die Stationen (dpkg-shlibdeps, lintian)
    container: debian:13
    timeout-minutes: 60
    steps:
      # vor checkout: mit git holt checkout das Repo samt .git (Stand im Paket)
      - name: Systempakete
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates clang cmake ninja-build pkg-config xz-utils curl unzip git zstd \
            libgtk-3-dev liblzma-dev libstdc++-14-dev libsecret-1-dev libjsoncpp-dev \
            dpkg-dev binutils patchelf librsvg2-bin file lintian >/dev/null

      - uses: actions/checkout@v4

      - name: Flutter-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rosenweg-flutter-ci
          key: flutter-linux-${{ hashFiles('linux/paket/werkzeuge.env', '.github/workflows/linux.yml') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-linux-${{ hashFiles('linux/paket/werkzeuge.env', '.github/workflows/linux.yml') }}-

      - name: Flutter (feste Version mit Pruefsumme)
        run: |
          set -euo pipefail
          . linux/paket/werkzeuge.env
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          git config --global --add safe.directory "$C/flutter-$FLUTTER_VERSION"
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$C/pub-cache" >> "$GITHUB_ENV"

      - name: Flutter pruefen und bauen
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version $version in pubspec.yaml"
            exit 1
          fi
          flutter config --no-analytics --enable-linux-desktop >/dev/null
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build linux --release

      - name: Debian-Paket
        run: |
          linux/paket/bauen.sh --nur-paket
          mkdir -p ausgabe
          cp linux/paket/out/*.deb ausgabe/

      - uses: actions/upload-artifact@v4
        with:
          name: rosenweg-salz-linux
          path: ausgabe/
          retention-days: 14

  veroeffentlichen:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write    # OIDC-Token fuer /apps (kein Geheimnis)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rosenweg-salz-linux
          path: ausgabe

      # Ueber github-script (REST-API), derselbe Weg wie android.yml.
      - name: Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            // Die Laeufe der anderen Plattformen legen dasselbe Release womoeglich zuerst an.
            const finden = () => github.rest.repos.getReleaseByTag({ ...repo, tag });
            let rel;
            try {
              rel = await finden();
            } catch (e) {
              try {
                rel = await github.rest.repos.createRelease({
                  ...repo, tag_name: tag, name: `Rosenweg Salz ${tag}`,
                  body: 'Android, Linux (Debian 13), macOS, Windows',
                });
              } catch (e2) {
                rel = await finden();
              }
            }
            const dateien = fs.readdirSync('ausgabe').filter((f) => f.endsWith('.deb'));
            if (!dateien.length) throw new Error('Kein .deb in ausgabe/');
            for (const f of dateien) {
              // wie 'gh release upload --clobber': gleichnamige Datei vorher entfernen
              const alt = rel.data.assets.find((a) => a.name === f);
              if (alt) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: alt.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: rel.data.id, name: f,
                data: fs.readFileSync(path.join('ausgabe', f)),
              });
              core.info(`Hochgeladen: ${f}`);
            }

      # Weg: Rosenweg/Website, pbx/README.md, "Seite /apps und App-Releases".
      - uses: Rosenweg/Website/.github/actions/apps-release@main
        with:
          dateien: ausgabe/*.deb
