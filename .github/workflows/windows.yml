# Windows-Installer (Inno Setup, .exe) auf einem von GitHub gehosteten
# Windows-Runner. Nur von Hand oder bei einem Tag v*: die Minuten zaehlen bei
# privaten Repos doppelt. Warum Inno Setup und nicht MSIX: siehe
# windows/installer/rosenweg-salz.iss.
#
# Bei einem Tag: Installer ins GitHub-Release und auf www.rosenweg4303.ch/apps
# (Plattform windows). Unsigniert, solange das Haus kein Code-Signing-
# Zertifikat hat (SmartScreen fragt beim ersten Start).
name: Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Release bei Tags
  id-token: write  # OIDC-Token fuer /apps (kein Geheimnis)

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Zugang zur Basis (privates Repo)
        uses: ./.github/actions/basis-zugang
        with:
          token: ${{ secrets.BASIS_TOKEN }}
          deploy-key: ${{ secrets.BASIS_DEPLOY_KEY }}

      - name: Bauen
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version $version in pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          flutter config --no-analytics --enable-windows-desktop >/dev/null
          flutter pub get --enforce-lockfile
          flutter build windows --release

      - name: Installer (Inno Setup)
        run: |
          set -euo pipefail
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$iscc" ]; then
            choco install innosetup -y --no-progress >/dev/null
          fi
          "$iscc" "/DVersion=$VERSION" "/DQuelle=$GITHUB_WORKSPACE\\build\\windows\\x64\\runner\\Release" windows/installer/rosenweg-salz.iss
          ls -la build/windows-installer

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/basis_key" "$RUNNER_TEMP/known_hosts"

      - uses: actions/upload-artifact@v4
        with:
          name: rosenweg-salz-windows
          path: build/windows-installer/*.exe
          retention-days: 14

      - name: Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Rosenweg Salz $GITHUB_REF_NAME" --notes "Android, Linux (Debian 13), macOS, Windows" \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" build/windows-installer/*.exe --clobber

      - uses: Rosenweg/Website/.github/actions/apps-release@main
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          dateien: build/windows-installer/*.exe
