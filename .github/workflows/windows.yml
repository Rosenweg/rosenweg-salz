# Windows-Installer (Inno Setup, .exe) auf einem von GitHub gehosteten
# Windows-Runner (windows-latest). Warum Inno Setup und nicht MSIX: siehe
# windows/installer/rosenweg-salz.iss.
#
# Wann: von Hand, bei einem Tag v* und - solange das Repo oeffentlich ist -
# auch bei jedem PR und Push auf main. In einem privaten Repo zaehlen die
# Minuten doppelt, dann nur von Hand oder bei Tags.
#
# Bei einem Tag: Installer ins GitHub-Release und auf www.rosenweg4303.ch/apps
# (Plattform windows). Unsigniert, solange das Haus kein Code-Signing-
# Zertifikat hat (SmartScreen fragt beim ersten Start).
name: Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  installer:
    # privat nur von Hand oder bei Tags (Minuten), oeffentlich immer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Bauen
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version $version in pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          flutter config --no-analytics --enable-windows-desktop >/dev/null
          flutter pub get --enforce-lockfile
          flutter build windows --release

      - name: Installer (Inno Setup)
        run: |
          set -euo pipefail
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$iscc" ]; then
            choco install innosetup -y --no-progress >/dev/null
          fi
          # Git-Bash wandelt Argumente wie /DVersion=... sonst in Pfade um
          # ("You may not specify more than one script filename").
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$iscc" "/DVersion=$VERSION" "/DQuelle=$GITHUB_WORKSPACE\\build\\windows\\x64\\runner\\Release" 'windows\installer\rosenweg-salz.iss'
          ls -la build/windows-installer

      - uses: actions/upload-artifact@v4
        with:
          name: rosenweg-salz-windows
          path: build/windows-installer/*.exe
          retention-days: 14

  # Bei einem Tag: Installer ins Release und an /apps. Eigener Job, damit nur
  # er Schreibrechte und das OIDC-Token hat.
  veroeffentlichen:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Release
      id-token: write   # OIDC-Token fuer /apps (kein Geheimnis)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rosenweg-salz-windows
          path: ausgabe

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Rosenweg Salz $GITHUB_REF_NAME" --notes "Android, Linux (Debian 13), macOS, Windows" \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" ausgabe/*.exe --clobber

      - uses: Rosenweg/Website/.github/actions/apps-release@main
        with:
          dateien: ausgabe/*.exe
